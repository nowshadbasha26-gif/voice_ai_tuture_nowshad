services:
  - type: web
    name: speakwise-tutor
    runtime: python
    plan: free
    buildCommand: "echo No external Python packages required"
    startCommand: "python server.py"
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SPEAKWISE_ACCESS_CODE
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
